# The shop on one server: Caddy (HTTPS) → website + Medusa → Postgres + Redis.
# Run from this folder:  sudo docker compose up -d
# Images are built by GitHub Actions (.github/workflows/images.yml) and pulled from GitHub
# Packages: the small server only downloads and runs them. Secrets live outside the repo in
# /opt/shop/*.env (chmod 600). Guide: docs/EC2-SETUP.md
name: shop

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: /opt/shop/db.env
    # Small settings for a 1 GB server (raise with a bigger server)
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" on purpose. Postgres is reachable only from the backend container.
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7
    restart: unless-stopped
    # Saved to disk (appendonly), so queued jobs (emails, reminders) survive a restart.
    # noeviction: never silently drop queued jobs when memory is full.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    image: ghcr.io/varadthedeveloper/e-commerce-backend:latest
    restart: unless-stopped
    env_file: /opt/shop/backend.env
    environment:
      # NODE_ENV comes from backend.env: "staging" for the test copy (test login codes,
      # no real keys yet), "production" for real customers (refuses to start without real keys)
      MEDUSA_WORKER_MODE: shared
      NODE_OPTIONS: --max-old-space-size=448
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # No "ports:". Caddy and the website reach it inside Docker.
    expose: ["9000"]
    volumes:
      - uploads:/app/static
    networks: [data, web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging: *logging

  storefront:
    image: ghcr.io/varadthedeveloper/e-commerce-storefront:latest
    restart: unless-stopped
    env_file: /opt/shop/storefront.env
    environment:
      # Server-side calls to the backend stay inside Docker
      MEDUSA_BACKEND_URL: http://backend:9000
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      backend: { condition: service_healthy }
    expose: ["8000"]
    networks: [web]
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [storefront, backend]
    env_file: /opt/shop/caddy.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/shop/demo-auth.caddy:/etc/caddy/demo-auth.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    logging: *logging

networks:
  # internal: no route to the internet. The database and Redis live only here.
  data:
    internal: true
  web: {}

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy-data:
  caddy-config:
