name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ecommerce
      REDIS_URL: redis://localhost:6379
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000,http://localhost:8000
      MEDUSA_DISABLE_TELEMETRY: "true"
      # Test mode for phone login: no SMS, every code is 123456 (refused in production)
      SMS_PROVIDER: console
      OTP_TEST_CODE: "123456"
      # Used by the integration tests to create a throwaway database
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      # Backend
      - name: Backend install
        working-directory: backend
        run: yarn install --immutable
      - name: Backend build (also generates types)
        working-directory: backend
        run: yarn build
      - name: Backend typecheck
        working-directory: backend
        run: yarn typecheck
      - name: Backend tests
        working-directory: backend
        run: yarn test:unit && yarn test:integration:http
      - name: Migrate and seed sample data
        working-directory: backend
        run: npx medusa db:migrate && yarn seed
      # The storefront needs the publishable key even to lint (next.config.js checks it)
      - name: Share the publishable key with later steps
        run: |
          KEY=$(psql "$DATABASE_URL" -tAc "select token from api_key where type='publishable' limit 1")
          echo "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=$KEY" >> "$GITHUB_ENV"
      # A throwaway admin user for the browser test that ships an order (CI database only)
      - name: Create test admin user
        working-directory: backend
        run: npx medusa user -e ci-staff@example.com -p ci-only-password-1
      # Payments and courier bookings go to fakes on localhost (test values only, refused in production)
      - name: Start backend
        working-directory: backend
        env:
          RAZORPAY_KEY_ID: rzp_test_fake
          RAZORPAY_KEY_SECRET: fake-secret
          RAZORPAY_WEBHOOK_SECRET: ci-webhook-secret
          RAZORPAY_API_BASE: http://127.0.0.1:9911
          SHIPROCKET_EMAIL: api@example.com
          SHIPROCKET_PASSWORD: fake-password
          SHIPROCKET_WEBHOOK_TOKEN: ci-hook-token
          SHIPROCKET_API_BASE: http://127.0.0.1:9912
        run: |
          nohup node integration-tests/fake-razorpay.js > ../fake-razorpay.log 2>&1 &
          nohup node integration-tests/fake-shiprocket.js > ../fake-shiprocket.log 2>&1 &
          nohup yarn dev > ../backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:9000/health && exit 0; sleep 2; done
          cat ../backend.log; exit 1

      # Storefront (its build reads products from the running backend)
      - name: Storefront install
        working-directory: storefront
        run: yarn install --immutable
      - name: Storefront typecheck, lint and unit tests
        working-directory: storefront
        run: yarn typecheck && yarn lint && yarn test
      - name: Storefront build
        working-directory: storefront
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_DEFAULT_REGION: in
        run: yarn build

      # Browser tests: the whole shop, on a desktop and a phone screen
      - name: Install browser
        working-directory: storefront
        run: npx playwright install --with-deps chromium
      - name: Start storefront
        working-directory: storefront
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_DEFAULT_REGION: in
        run: |
          nohup yarn start > ../storefront.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8000/mr && exit 0; sleep 2; done
          cat ../storefront.log; exit 1
      - name: Browser tests
        working-directory: storefront
        env:
          E2E_ADMIN_EMAIL: ci-staff@example.com
          E2E_ADMIN_PASSWORD: ci-only-password-1
          E2E_WEBHOOK_TOKEN: ci-hook-token
        run: yarn test:e2e
      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: storefront/test-results
          retention-days: 7
