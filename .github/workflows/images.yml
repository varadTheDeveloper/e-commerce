# Builds the server images and stores them in GitHub Packages (ghcr.io), after CI passes on main.
# The server only pulls them (docs/EC2-SETUP.md): a 1 GB server cannot build them itself.
#
# The website image is built for one server: it needs that server's addresses and publishable key
# (repository Settings → Secrets and variables → Actions → Variables):
#   SHOP_BASE_URL         https://shop.example.in      (the website)
#   SHOP_API_URL          https://api.example.in       (the backend, reachable from GitHub: the build reads the catalogue)
#   SHOP_PUBLISHABLE_KEY  pk_...                       (public by design; printed by the setup steps)
#   SHOP_IMAGE_HOSTS      api.example.in               (where uploaded photos are served: the API or the S3 bucket)
# Until SHOP_PUBLISHABLE_KEY is set, only the backend image is built.
name: Server images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-images
  cancel-in-progress: false

jobs:
  backend:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: deploy/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/varadthedeveloper/e-commerce-backend:latest
            ghcr.io/varadthedeveloper/e-commerce-backend:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  storefront:
    if: vars.SHOP_PUBLISHABLE_KEY != '' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: storefront
          file: deploy/storefront.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.SHOP_BASE_URL }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ vars.SHOP_PUBLISHABLE_KEY }}
            MEDUSA_BACKEND_URL=${{ vars.SHOP_API_URL }}
            IMAGE_HOSTS=${{ vars.SHOP_IMAGE_HOSTS }}
          tags: |
            ghcr.io/varadthedeveloper/e-commerce-storefront:latest
            ghcr.io/varadthedeveloper/e-commerce-storefront:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront
